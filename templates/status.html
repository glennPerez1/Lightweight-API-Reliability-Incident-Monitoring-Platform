<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            margin: 0;
            padding: 2rem;
            color: #1a1a1a;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e5e5e3;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card.up { border-left: 4px solid #1d9e75; }
        .card.down { border-left: 4px solid #e24b4a; }
        .name { font-weight: 500; }
        .url { font-size: 0.8rem; color: #888; }
        .badge {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 999px;
        }
        .badge.up { background: #e1f5ee; color: #085041; }
        .badge.down { background: #fcebeb; color: #791f1f; }
        .stats { font-size: 0.8rem; color: #555; text-align: right; }
    </style>
</head>
<body>
    <h1>Service status</h1>
    {% for m in monitors %}
    <div class="card {{ 'down' if m.is_down else 'up' }}">
        <div>
            <div class="name">{{ m.name }}</div>
            <div class="url">{{ m.url }}</div>
        </div>
        <div class="stats">
            <span class="badge {{ 'down' if m.is_down else 'up' }}">
                {{ 'DOWN' if m.is_down else 'UP' }}
            </span>
            <div>
                {% if m.uptime.uptime_pct is not none %}
                    {{ m.uptime.uptime_pct }}% uptime (24h) · p95 {{ m.uptime.p95_latency_ms }}ms
                {% else %}
                    No data yet
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</body>
</html>
